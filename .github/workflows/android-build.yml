
name: Build CardAnswer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q CardAnswer_2.0_Android_Project.zip -d .

      - name: Build APK
        run: gradle --no-daemon -p CardAnswer :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CardAnswer-2.0-APK
          path: CardAnswer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
