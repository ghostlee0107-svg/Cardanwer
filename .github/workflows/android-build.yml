
name: Build CardAnswer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q CardAnswer_2.0_Android_Project.zip -d .

      - name: Fix Android source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("CardAnswer/app/build.gradle")
          s = gradle.read_text()

          s = s.replace(
              "        targetSdk 35",
              """        targetSdk 35
                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
                  kotlinOptions {
                      jvmTarget = '17'
                  }"""
          )
          gradle.write_text(s)

          main = Path("CardAnswer/app/src/main/java/com/example/cardanswer/MainActivity.kt")
          s = main.read_text()

          if "singleLine = true" in s:
              s = s.replace("singleLine = true", "setSingleLine(true)")
          main.write_text(s)

          print("Android source fixes applied.")
          PY

      - name: Build APK
        run: gradle --no-daemon -p CardAnswer :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CardAnswer-2.0-APK
          path: CardAnswer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
